variables:
     GIT_SUBMODULE_STRATEGY: recursive
     CI_JOB_TOKEN: es7VysP4Bek_M3ksbdyp

stages:
  - build

build-cocos:
  stage: build
  tags:
    - runner-windows
  script:
    - call npm install
    - cd ./extensions/game-client-components && call npm install
    - cd ..
    - cd game-client-base && call npm install
    - cd ../../
    - npm run build-web-mobile-ci
  artifacts:
    when: always
    paths:
      - ./build/web-mobile
    expire_in: 1 day
  allow_failure:
    exit_codes: 36